<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800" role="img" aria-label="Nocturne placeholder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2420"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#C4A06A" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#C4A06A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C4A06A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="1800" fill="url(#g)"/>
  <rect width="1400" height="1800" fill="url(#glow)"/>
  <!-- vessel -->
  <rect x="520" y="780" width="360" height="520" rx="8" fill="#E8E4DE" opacity="0.92"/>
  <rect x="540" y="800" width="320" height="40" fill="#C4A06A" opacity="0.25"/>
  <!-- wax pool -->
  <ellipse cx="700" cy="820" rx="150" ry="24" fill="#C4A06A" opacity="0.35"/>
  <!-- wick -->
  <rect x="696" y="700" width="8" height="120" fill="#2A2A2A"/>
  <!-- flame -->
  <ellipse cx="700" cy="660" rx="28" ry="56" fill="#C4A06A"/>
  <ellipse cx="700" cy="670" rx="12" ry="28" fill="#E8E4DE" opacity="0.85"/>
  <!-- soft floor shadow -->
  <ellipse cx="700" cy="1320" rx="220" ry="28" fill="#000" opacity="0.35"/>
  <text x="700" y="1550" text-anchor="middle" fill="#E8E4DE" font-family="Georgia, serif" font-size="36" letter-spacing="8" opacity="0.45">NOCTURNE</text>
</svg>
